<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just Us ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Georgia,serif;
  background:linear-gradient(135deg,#fff1f5,#f9e4ec 45%,#fff8f3);
  color:#3d2730;display:flex;align-items:center;justify-content:center;padding:20px;
}
.wrap{width:min(620px,100%)}
.card{
  background:rgba(255,255,255,.82);backdrop-filter:blur(12px);
  border:1px solid rgba(120,50,75,.12);border-radius:28px;
  padding:28px;box-shadow:0 20px 60px rgba(80,30,50,.12);
}
.heart{font-size:42px;text-align:center;margin-bottom:4px}
h1{text-align:center;font-size:34px;margin:4px 0 8px}
.sub{text-align:center;color:#856572;font-family:Arial,sans-serif;margin-bottom:24px}
.progress{height:7px;background:#f1d9e1;border-radius:99px;overflow:hidden;margin-bottom:22px}
.bar{height:100%;width:0;background:#b75c7b;border-radius:99px;transition:.3s}
.badge{display:inline-block;background:#f5dce5;color:#93415f;border-radius:999px;padding:7px 13px;font:600 12px Arial,sans-serif}
.question{font-size:27px;line-height:1.3;text-align:center;margin:28px 8px}
.hint{text-align:center;color:#987984;font:14px Arial,sans-serif;min-height:20px}
.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:24px}
button{
  border:0;border-radius:15px;padding:13px 20px;min-height:48px;
  font:600 15px Arial,sans-serif;cursor:pointer;
}
.primary{background:#a94d6d;color:white}
.secondary{background:#f5e5eb;color:#70384d}
button:active{transform:scale(.98)}
.screen{display:none}.screen.active{display:block}
input{
  width:100%;padding:14px;border:1px solid #ead2dc;border-radius:13px;
  margin:7px 0;font-size:16px;outline:none;
}
label{font:600 13px Arial,sans-serif;color:#75475a}
.result{text-align:center;font-size:22px;line-height:1.5;margin:20px 0}
.small{font:13px Arial,sans-serif;color:#927481;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<div class="card">

<section id="start" class="screen active">
  <div class="heart">❤️</div>
  <h1>Just Us</h1>
  <p class="sub">A little game for two people who like each other a lot.</p>
  <label>Your name</label>
  <input id="p1" placeholder="Your name">
  <label>Her name</label>
  <input id="p2" placeholder="Her name">
  <div class="buttons">
    <button class="primary" onclick="startGame()">Start our game ❤️</button>
  </div>
  <p class="small">Take turns answering. No cheating. Be honest. 😌</p>
</section>

<section id="game" class="screen">
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div style="text-align:center"><span class="badge" id="category">CUTE</span></div>
  <div class="question" id="question"></div>
  <p class="hint" id="hint">Answer honestly, then press next.</p>
  <div class="buttons">
    <button class="primary" onclick="nextQuestion()">Next ❤️</button>
    <button class="secondary" onclick="restart()">Restart</button>
  </div>
  <p class="small" id="counter"></p>
</section>

<section id="end" class="screen">
  <div class="heart">💗</div>
  <h1 id="ending">That was cute.</h1>
  <div class="result" id="result"></div>
  <div class="buttons">
    <button class="primary" onclick="restart()">Play again</button>
  </div>
  <p class="small">Now go tell each other your favorite answer. 🫶</p>
</section>

</div>
</div>

<script>
const questions=[
["CUTE","Who fell first?"],
["CUTE","What is one tiny thing I do that secretly makes you smile?"],
["FLIRTY","What is the most attractive thing about me?"],
["FUNNY","Who is more dramatic when they are jealous?"],
["ROMANTIC","What moment with me would you relive forever?"],
["FLIRTY","What is something you want me to do more often?"],
["CUTE","What nickname suits me the most?"],
["DEEP","What makes you feel safest with me?"],
["FUNNY","If we were stuck together for 24 hours, who would annoy the other first?"],
["ROMANTIC","If we could disappear anywhere together tonight, where would we go?"],
["FLIRTY","What is something about me you find dangerously attractive?"],
["CUTE","What is your favorite memory of us?"],
["DEEP","What is one thing you hope we experience together someday?"],
["FUNNY","Who would survive longer in a zombie apocalypse?"],
["FINAL","Complete this: “I knew I really liked you when…”"]
];

let i=0,p1="",p2="";

function show(id){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}
function startGame(){
 p1=document.getElementById("p1").value.trim()||"You";
 p2=document.getElementById("p2").value.trim()||"Her";
 i=0;render();show("game");
}
function render(){
 const [cat,q]=questions[i];
 document.getElementById("category").textContent=cat;
 document.getElementById("question").textContent=q;
 document.getElementById("counter").textContent=`Question ${i+1} of ${questions.length} • ${p1} & ${p2}`;
 document.getElementById("bar").style.width=((i+1)/questions.length*100)+"%";
}
function nextQuestion(){
 if(i<questions.length-1){i++;render();}
 else{
   document.getElementById("ending").textContent=`${p1} ❤️ ${p2}`;
   document.getElementById("result").innerHTML=`You made it through all ${questions.length} questions.<br><br><b>The real prize is getting to know each other a little better. 🫶</b>`;
   show("end");
 }
}
function restart(){
 i=0;show("start");
}
</script>
</body>
</html>
